<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #99ac9a, #091dae);
}

.container {
    width: 680px;
    height: 420px;
    margin: 30px auto;
    background-color: white;
    border-radius: 25px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 5px 10px gray;
}

/* Left side */

.welcome {
    width: 50%;
    background-color: #d27897;
    color: white;
    text-align: center;
    padding-top: 130px;
    border-radius: 25px 100px 100px 25px;
}

.welcome h1 {
    font-size: 28px;
}

.welcome p {
    font-size: 14px;
}

.signin {
    margin-top: 20px;
    padding: 10px 40px;
    background: transparent;
    color: white;
    border: 2px solid white;
}

/* Right side */

.register {
    width: 50%;
    text-align: center;
    padding-top: 45px;
}

.register h1 {
    font-size: 28px;
}

.social button {
    width: 38px;
    height: 38px;
    margin: 5px;
    background: rgb(242, 234, 239);
    border: 1px solid #39717a;
    border-radius: 7px;
    color: #39717a;
    font-weight: bold;
}

.register h2 {
    margin: 15px 0 5px;
}

.register p {
    font-size: 12px;
    color: #555;
}

.register input {
    display: block;
    width: 75%;
    margin: 12px auto;
    padding: 10px;
    border: none;
    background-color: #e2dbe0;
}

.signup {
    margin-top: 5px;
    padding: 10px 45px;
    border: none;
    background-color: #c4c900;
    color: rgb(223, 226, 225);
    font-weight: bold;
}
    </style>
</head>
<body>

<div class="container">

    <div class="welcome">
        <h1>Welcome Back!</h1>
        <p>Provide your personal details to use all<br>features</p>
        <button class="signin">SIGN IN</button>
    </div>

    <div class="register">
        <h1>Register With</h1>

        <div class="social">
            <button>G+</button>
            <button>f</button>
            <button>◉</button>
            <button>in</button>
        </div>

        <h2>OR</h2>
        <p>Fill Out The Following Info For Registration</p>

        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">

        <button class="signup">SIGN UP</button>
    </div>

</div>

</body>
</html>
