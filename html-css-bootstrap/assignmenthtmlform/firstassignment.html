
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            font-family: Arial;
            background-color: white;
        }

        .register {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            border: 5px solid #ddd;
        }

        h1 {
            font-size: 40px;
        }

        label {
            font-size: 20px;
            font-weight: bold;
        }

        .inputs{
            width: 100%;
        }

       
        .button{
            width: 510px;
            height: 40px;
            font-size: 30px;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 30px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="register">

        <h1>Register</h1>

        <p>Kindly fill in this form to register.</p>

        <form>

            <label>Username</label><br>
            <input class="inputs" type="text" placeholder="Enter username"><br>

            <label>Email</label><br>
            <input class="inputs" type="email" placeholder="Enter Email"><br>

            <label>Password</label><br>
            <input class="inputs" type="password" placeholder="Enter Password"><br>

            <label>Repeat Password</label><br>
            <input class="inputs" type="password" placeholder="Repeat Password"><br><br>

            <button class="button" type="submit">Register</button>

        </form>

        <div class="login">
            Already have an account?
            <a href="#">Log in</a>
        </div>

    </div>

</body>
</html>
