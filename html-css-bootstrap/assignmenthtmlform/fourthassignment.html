<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
   <style>
    body {
    background-color: white;
    font-family: Arial, sans-serif;
}

.form-box {
    width: 260px;
    margin: 15px auto;
    padding: 15px 25px;
    background-color: #eee;
    border: 1px solid #ccc;
    border-radius: 7px;
    box-shadow: 0 2px 7px #aaa;
}

h1 {
    text-align: center;
    font-size: 26px;
    font-weight: normal;
    color: #666;
}

hr {
    border: 0;
    border-top: 1px solid #ddd;
}

.type {
    text-align: center;
    margin: 18px 0;
    color: #777;
}

.type input {
    margin-left: 15px;
}

.form-box > input {
    width: 100%;
    padding: 10px;
    margin: 7px 0;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 14px;
}

.gender {
    text-align: center;
    margin: 15px 0;
    color: #777;
}

.gender input {
    margin-left: 15px;
}

p {
    display: inline-block;
    font-size: 11px;
    color: #777;
    margin-top: 15px;
}

a {
    color: blue;
}

button {
    float: right;
    margin-top: 25px;
    padding: 10px 20px;
    background-color: #4169c1;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #3155a5;
}
   </style>
</head>
<body>

    <div class="form-box">

        <h1>Registration</h1>

        <hr>

        <div class="type">
            <input type="radio" name="type" checked> Personal
            <input type="radio" name="type"> Company
        </div>

        <input type="email" placeholder="✉  Email">
        <input type="text" placeholder="♟  Name">
        <input type="password" placeholder="⚿  Password">

        <div class="gender">
            <input type="radio" name="gender" checked> Male
            <input type="radio" name="gender"> Female
        </div>

        <p>
            By clicking Register, you<br>
            agree on our 
            <a href="#">terms and<br> condition.</a>
        </p>

        <button>Register</button>

    </div>

</body>
</html>
