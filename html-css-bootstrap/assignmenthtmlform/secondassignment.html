<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>
    <link rel="stylesheet" href="./stylel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="main">

        <!-- Left Side -->
        <div class="left">

            <h1><i class="fa-brands fa-instagram"></i></h1>

            <h2>
                See everyday moments from<br>
                your <span>close friends.</span>
            </h2>

            <div class="photo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnAoCuQS2xXX9glML7KaRL1SylmcBhcKcyipCOqz8BQg&s=10" alt="">
            </div>

        </div>

        <!-- Right Side -->
        <div class="right">

            <div class="login">

                <h3>Log into Instagram</h3>

                <input type="text" placeholder="Mobile number, username or email">

                <input type="password" placeholder="Password">

                <button>Log in</button>

                <a href="#">Forgot password?</a>

                <hr>

                <button class="facebook">

                    <i class="fa-brands fa-facebook"></i>
                         Log in with Facebook
                </button>

                <button class="create">
                    Create new account
                </button>

            </div>

        </div>

    </div>

</body>
</html>
