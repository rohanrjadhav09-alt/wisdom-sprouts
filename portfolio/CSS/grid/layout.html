<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .layoutone{
            height: 700px;
            background-color: pink;
            display: grid;
            grid-template-areas: 'hone hone hone hone'
                                    'asidone conone  conone conone'
                                   ' asidone fotone fotone fotone' ;
        }
        .headerone{
            height: 200px;
            background-color: black;
            grid-area: hone ;
            }
        .asideone{
            height: 500px;
            background-color: white;
            grid-area: asidone;
        }
        .contentone{
            height: 450px;
            background-color: grey;
            grid-area: conone;
        }
        .footerone{
            height: 50px;
            background-color: brown;
            grid-area: fotone;
        }
    </style>
</head>
<body>
    <div class="layoutone">
        <div class="headerone"></div>
        <div class="asideone"></div>
        <div class="contentone"></div>
        <div class="footerone"></div>


    </div>
</body>
</html>
