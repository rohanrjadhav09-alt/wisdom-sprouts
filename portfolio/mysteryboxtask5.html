<!DOCTYPE html>
<html>
<head>
    <title>Mystery Box Order Form</title>
</head>

<body>

    <h2>Mystery Box Order Form</h2>

    <form>

        <label>Box Type:</label>
        <select>
            <option>Small Box</option>
            <option>Medium Box</option>
            <option>Large Box</option>
        </select>
        <br><br>

        <label>Price:</label>
        <input type="text" placeholder="Enter Price">
        <br><br>

        <label>Quantity:</label>
        <input type="number" min="1">
        <br><br>

        <label>Preferred Items:</label><br>
        <input type="checkbox"> Toys
        <input type="checkbox"> Books
        <input type="checkbox"> Gadgets
        <br><br>

        <label>Delivery Address:</label><br>
        <textarea rows="4" cols="35"></textarea>
        <br><br>

        <label>Instructions:</label><br>
        <textarea rows="3" cols="35"></textarea>
        <br><br>

        <button type="submit">Place Order</button>

    </form>

</body>
</html>
