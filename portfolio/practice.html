<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1 align="center">Student Registration Form</h1>

    <form action="#" method="post" autocomplete="off" enctype="multipart/form-data">

        <label for="fname">Full Name:</label>
        <input type="text" id="fname" name="fullname"
            placeholder="Enter your full name"
            pattern="[a-zA-Z ]+" required>
        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile"
            placeholder="Enter your phone number"
            pattern="[0-9]{10}" required>
        <br><br>

        <label for="birthday">Date of Birth:</label>
        <input type="date" id="birthday" name="birthday" required>
        <br><br>

        <p>Select your Gender:</p>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
            placeholder="Enter your email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
            placeholder="Enter password" required>
        <br><br>

        <label>Select Subjects:</label>
        <br>

        <input type="checkbox" id="english" name="subject" value="english">
        <label for="english">English</label>

        <input type="checkbox" id="marathi" name="subject" value="marathi">
        <label for="marathi">Marathi</label>

        <input type="checkbox" id="hindi" name="subject" value="hindi">
        <label for="hindi">Hindi</label>

        <br><br>

        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="computer_science">Computer Science</option>
            <option value="information_technology">Information Technology</option>
            <option value="engineering">Engineering</option>
            <option value="business_administration">Business Administration</option>
        </select>

        <br><br>

        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address"
            rows="4" cols="30"
            placeholder="Enter your address"
            required></textarea>

        <br><br>

        <label for="profilePic">Profile Picture:</label>
        <input type="file" id="profilePic" name="profilePic" accept="image/*">

        <br><br>

        <label for="favColor">Favorite Color:</label>
        <input type="color" id="favColor" name="favColor" value="#ff0000">

        <br><br>

        <label for="skillsLevel">Skills Level:</label>
        <input type="range" id="skillsLevel" name="skillsLevel"
            min="0" max="100" value="50">

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
       

    </form>

</body>

</html>
