<body>

    <h2>Agent Mission Form</h2>

    <form>
        <label>Agent Name:</label>
        <input type="text">
        <br><br>

        <label>Mission Type:</label>
        <select>
            <option>Rescue</option>
            <option>Surveillance</option>
            <option>Investigation</option>
        </select>
        <br><br>

        <label>Priority:</label>
        <input type="radio" name="p"> Low
        <input type="radio" name="p"> Medium
        <input type="radio" name="p"> High
        <br><br>

        <label>Location:</label>
        <input type="text">
        <br><br>

        <label>Equipment:</label><br>
        <input type="checkbox"> GPS<br>
        <input type="checkbox"> Radio<br>
        <input type="checkbox"> First Aid Kit
        <br><br>

        <label>Mission Instructions:</label><br>
        <textarea rows="5" cols="40"></textarea>
        <br><br>

        <button type="submit">Accept Mission</button>
    </form>
