<body>
    <h1 align="center">Registration Form</h1>
    <form action="" method="get" autocomplete="off">
        <label for="name">Name</label>
        <input id="name" type="text" pattern="[a-zA-Z]+" placeholder="add your name" required>

        <label for="email">Email</label>
        <input id="name" type="text" pattern="[[a-zA-Z0-9.]" placeholder="add your name" required>

        <label for="password">Password</label>
        <input id="name" type="number" pattern="[]+" placeholder="enter password" ><br>

        <label for="">Select Gender</label>
        <input type="radio" name="gender" value="male" id=""><label for="male">Male</label>
        <input type="radio" name="gender" value="female" id=""><label for="female">Female</label><br>

        <label for="hobbies">Hobbies</label>
        <input type="checkbox" name="hobbies" id="reading">reading
        <input type="checkbox" name="hobbies" id="swimming">swimming
        <input type="checkbox" name="hobbies" id="gaming">gaming
        <input type="checkbox" name="hobbies" id="coding">Coding

         <button type="submit">Submit </button>
</body>
